<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Dashboard · Arifuzzaman Raihan</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script><script src="ui.js"></script>
<style>
body.adm{overflow-x:hidden}.adm .nav{display:none}
.lay{display:grid;grid-template-columns:var(--sw,248px) 1fr;min-height:100vh;transition:grid-template-columns .25s ease}
.lay.col{--sw:72px}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px;gap:4px;z-index:30;overflow:hidden}
.side .top{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;font-weight:700;white-space:nowrap}
.side .top [data-logo]{width:36px;height:36px;flex:0 0 36px;display:block}
.side .nl{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mut);white-space:nowrap;font-size:.95rem;transition:background .2s,color .2s}
.side .nl svg.lucide{width:20px;height:20px}
.side .nl:hover{background:var(--at);color:var(--txt)}
.side .nl.on{background:var(--a);color:#fff}
.side .grow{flex:1}.side .sep{height:1px;background:var(--line);margin:8px 4px}
.lay.col .side .lbl{opacity:0;width:0;overflow:hidden}.lay.col .side .nl{justify-content:center;padding:10px}
.main{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.bar h1{font-size:1.15rem;margin:0;flex:1}
#view{padding:28px;animation:vin .35s ease}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.mb{display:none}.scrim{display:none}
@media(max-width:860px){.lay,.lay.col{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .28s ease}.lay.open .side{transform:none}.lay.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}.mb{display:inline-grid}.cb{display:none}.lay.col .side .lbl{opacity:1;width:auto}.bar{padding:12px 16px}#view{padding:18px}}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.kpi b{font-size:2rem;display:block;line-height:1.1}.kpi .ki{color:var(--a);margin-bottom:6px;display:block}
.chartbar{transform-origin:bottom;transform-box:fill-box;animation:grow .8s ease both}@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#inv{background:#fff;color:#111;padding:32px;border-radius:12px}#inv th,#inv td{border-color:#ddd}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;left:0;top:0;width:100%}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.ph h2{margin:0}
.stack{display:grid;gap:12px}.grow1{flex:1;min-width:0}.nowrap{flex-wrap:nowrap}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);min-width:240px}.srch input{border:0!important;background:none;min-height:40px;padding:0}.srch.sm{min-width:170px}
.fchips,.tabs2{display:flex;gap:6px;flex-wrap:wrap}.tabs2{margin-bottom:16px}
.fc{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:.88rem;color:var(--mut);transition:background .2s,color .2s}.fc:hover{color:var(--txt)}.fc.on{background:var(--a);border-color:var(--a);color:#fff}
.st{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:600;text-transform:capitalize;background:var(--chip);color:var(--chipt);white-space:nowrap}
.st.paid,.st.confirmed{background:#0284c7;color:#fff}.st.overdue,.st.rejected{background:#fee2e2;color:#b91c1c}.st.void{text-decoration:line-through}
.lrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.thumb{width:64px;height:48px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;overflow:hidden;color:var(--mut)}.thumb img{width:100%;height:100%;object-fit:cover}
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.meta3{display:flex;gap:16px;flex-wrap:wrap;color:var(--mut);font-size:.88rem;margin-top:8px}.meta3 span{display:inline-flex;gap:6px;align-items:center}
.req{white-space:pre-wrap;margin-top:10px;padding:12px;border-radius:10px;background:var(--bg2)}
.ib.sm{width:34px;height:34px}
.fi{display:grid;gap:6px}.fi label{font-size:.85rem;font-weight:600}.full{grid-column:1/-1}
.tagin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card)}.tagin input{border:0!important;flex:1;min-width:140px;min-height:32px;background:none}
.tg{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--chip);color:var(--chipt);font-size:.85rem}.tg button{all:unset;cursor:pointer;display:inline-grid;opacity:.7}.tg button:hover{opacity:1}
.listin{display:grid;gap:8px}.lr{display:flex;gap:8px;align-items:center}.lr input{flex:1}
.rep{display:grid;gap:12px}.grp .gh{margin-bottom:12px}.rep>.btn{justify-self:start}
.ed{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}@media(max-width:1000px){.ed{grid-template-columns:1fr}}
.ttl{font-size:1.5rem;font-weight:700;border:0!important;padding:0!important;background:none}.exc{border:0!important;padding:6px 0!important;color:var(--mut);background:none}
.wtb{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0}
.wy{min-height:340px;outline:0;padding:6px 2px;line-height:1.7}.wy:empty:before{content:attr(data-ph);color:var(--mut)}.wy img{max-width:100%;border-radius:10px}.wy blockquote{border-left:3px solid var(--line);padding-left:12px;color:var(--mut)}
.drop{display:grid;place-items:center;gap:6px;min-height:140px;border:1px dashed var(--line);border-radius:12px;cursor:pointer;overflow:hidden;color:var(--mut)}.drop img{width:100%;height:160px;object-fit:cover}
.tgl{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}.tgl input{display:none}.tgl span{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}.tgl span:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}.tgl input:checked+span{background:var(--a)}.tgl input:checked+span:after{transform:translateX(18px)}
.prog{height:6px;border-radius:999px;background:var(--line);margin:12px 0;overflow:hidden}.prog span{display:block;height:100%;background:var(--a);transition:width .6s}
.mlist{display:grid;gap:8px}.mrow{display:grid;grid-template-columns:28px 1fr 160px 150px 36px;gap:8px;align-items:center}.mrow .mdot{color:var(--mut)}.mrow.done .mdot{color:var(--a)}.mrow.done input[data-tt]{text-decoration:line-through;color:var(--mut)}
@media(max-width:700px){.mrow{grid-template-columns:28px 1fr 36px}.mrow input[type=date],.mrow select{grid-column:2/3}}
.itab td,.itab th{white-space:nowrap}.lines input{min-height:38px}
.sum{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.sum div{display:flex;justify-content:space-between}.sum .tt{font-size:1.15rem;border-top:1px solid var(--line);padding-top:8px}
.av{width:40px;height:40px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font-weight:700}
.ki{color:var(--a);display:block;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:100;padding:20px;animation:vin .2s}.mbox{max-width:400px;width:100%}.dang{background:#dc2626!important}.dang:hover{background:#b91c1c!important}
.ivh{display:flex;justify-content:space-between;gap:20px}.ivst{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;border:1px solid #ccc;font-weight:600}
#inv table{width:100%;border-collapse:collapse}#inv th,#inv td{padding:9px;border-bottom:1px solid #ddd;text-align:left}
</style></head><body class="adm">
<header class="nav"><div class="wrap"><a class="brand" href="index.html"><span data-logo style="width:38px;height:38px;display:block"></span>Dashboard</a><div class="tools"><button class="ib" data-theme-btn></button></div></div></header>
<main class="wrap">
<div id="setup" class="card hidden" style="margin-top:30px"><h3>Backend not connected</h3><p class="mut">Fill SUPABASE_URL and SUPABASE_ANON_KEY in config.js and run supabase/schema.sql.</p></div>
<div id="login" class="card hidden rv" style="max-width:420px;margin:50px auto"><div data-illus="lock" style="max-width:200px;margin:0 auto 8px"></div><h3 style="text-align:center">Welcome back</h3><form id="lf" style="display:grid;gap:12px;margin-top:12px"><input id="le" type="email" placeholder="Email" required autocomplete="username"><input id="lp" type="password" placeholder="Password" required autocomplete="current-password"><button class="btn p">Sign in</button><p id="lmsg" class="mut small" role="status"></p></form></div>
</main><div id="app" class="hidden lay"><aside class="side" id="side"><div class="top"><span data-logo></span><span class="lbl">Raihan · Admin</span></div><nav id="tabs" style="display:flex;flex-direction:column;gap:4px"></nav><div class="grow"></div><div class="sep"></div><button class="nl" data-theme-btn2 id="thm"><i data-lucide="sun-moon"></i><span class="lbl">Theme</span></button><a class="nl" href="index.html"><i data-lucide="external-link"></i><span class="lbl">View site</span></a><button class="nl" id="logout"><i data-lucide="log-out"></i><span class="lbl">Logout</span></button></aside><div class="scrim" id="scrim"></div><div class="main"><div class="bar"><button class="ib mb" id="mb" aria-label="Open menu"><i data-lucide="menu"></i></button><button class="ib cb" id="cb" aria-label="Collapse sidebar"><i data-lucide="panel-left"></i></button><h1 id="vt">Dashboard</h1><span class="mut small" id="who"></span></div><div id="view"></div></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js" defer></script>
<script src="admin.js"></script></body></html>
