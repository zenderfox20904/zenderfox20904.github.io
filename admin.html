<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin · Arifuzzaman Raihan</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css">
<style>.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0}.tabs .btn.on{background:var(--grad);border:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#inv{background:#fff;color:#111;padding:32px;border-radius:12px}#inv table th,#inv table td{border-color:#ddd}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;left:0;top:0;width:100%}}</style></head><body>
<header class="nav"><div class="wrap"><a class="brand" href="index.html"><img src="logo.svg" alt="">Admin</a><button class="btn sm hidden" id="logout">Log out</button></div></header>
<main class="wrap" style="padding-bottom:60px">
<div id="setup" class="card hidden" style="margin-top:30px"><h3>Backend not connected</h3><p class="mut">Fill SUPABASE_URL and SUPABASE_ANON_KEY in config.js and run supabase/schema.sql. See README.md.</p></div>
<div id="login" class="card hidden" style="max-width:420px;margin:60px auto"><h3>Sign in</h3><form id="lf" style="display:grid;gap:12px;margin-top:12px"><input id="le" type="email" placeholder="Email" required autocomplete="username"><input id="lp" type="password" placeholder="Password" required autocomplete="current-password"><button class="btn p">Sign in</button><p id="lmsg" class="mut small"></p></form></div>
<div id="app" class="hidden"><nav class="tabs" id="tabs"></nav><div id="view"></div></div></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js" defer></script>
<script src="admin.js"></script></body></html>
